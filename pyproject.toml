[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boldsimnet"
version = "0.1.0"
description = "Reference implementation of the BOLDSimNet graph-similarity score"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Boseong Kim", email = "boseong@hanyang.ac.kr" },
]
maintainers = [
  { name = "Boseong Kim", email = "boseong@hanyang.ac.kr" },
]
dependencies = ["numpy>=1.26,<3"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
boldsimnet = "boldsimnet.cli:main"

[project.urls]
Homepage = "https://github.com/labhai/BOLDSimNet"
Repository = "https://github.com/labhai/BOLDSimNet"
Issues = "https://github.com/labhai/BOLDSimNet/issues"
Preprint = "https://arxiv.org/abs/2504.01274"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boldsimnet = ["py.typed"]
